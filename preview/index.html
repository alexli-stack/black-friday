  .unit { background: var(--navy-2); border-radius: 14px; min-width: 76px; text-align: center; padding: 10px 8px; }

    .hero { padding: 36px 16px 20px; }
    .super-rest, .deal-grid, .best-grid { grid-template-columns: 1fr; }
    .videos { display: flex; overflow: auto; padding-bottom: 6px; }
    .vcard { min-width: 230px; }
    .unit { min-width: 64px; }
    .unit b { font-size: 22px; }

  }
  @media (prefers-reduced-motion: reduce) {

  }
</style>

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const imgSrc = (url) => {
  if (!url) return "";
  if (!url.includes("cdn.shopify.com") || /[?&]width=/.test(url)) return url;
  return url + (url.includes("?") ? "&" : "?") + "width=720";
};

  const safe = esc(href || "#");
  if (!href || href.startsWith("#") || href.startsWith("mailto:")) return `href="${safe}"`;

};

  const tagClass = tone === "deal" ? "tag--deal" : tone === "full" ? "tag--full" : tone === "best" ? "tag--best" : "tag--super";
  return `<article class="card${item.layout === "lead" ? " card--lead" : ""}">
    ${media(item)}
    <div>
      <span class="tag ${tagClass}">${tag}</span>
      <h3>${esc(item.name)}</h3>
      ${options(item)}
      ${(current.note || item.note) ? `<p class="note" data-note-now>${esc(current.note || item.note)}</p>` : `<p class="note" data-note-now hidden></p>`}
      ${priceBlock(item, tone)}
      <a class="btn btn--navy btn--block" ${attrs(item.href)}>${esc(item.cta || "Shop now")}</a>
    </div>
  </article>`;
};

document.addEventListener("click", (event) => {
  const button = event.target.closest(".opt");
  if (!button) return;
  const cardNode = button.closest(".card");
  cardNode.querySelectorAll(".opt").forEach((item) => {
    item.classList.remove("is-on");
    item.setAttribute("aria-pressed", "false");
  });
  button.classList.add("is-on");
  button.setAttribute("aria-pressed", "true");
  cardNode.querySelector("[data-price-now]").textContent = button.dataset.price;
  cardNode.querySelector("[data-save-now]").textContent = button.dataset.save;
  cardNode.querySelector("[data-note-now]").textContent = button.dataset.note;
});

const units = {
  Days: document.querySelector('[data-unit="Days"]'),
  Hours: document.querySelector('[data-unit="Hours"]'),
  Minutes: document.querySelector('[data-unit="Minutes"]'),
  Seconds: document.querySelector('[data-unit="Seconds"]')
};
const pad = (value) => String(value).padStart(2, "0");
const tick = () => {
  const left = endDate.getTime() - Date.now();
  if (left <= 0) {
    units.Days.textContent = "00";
    units.Hours.textContent = "00";
    units.Minutes.textContent = "00";
    units.Seconds.textContent = "00";
    return;
  }
  units.Days.textContent = pad(Math.floor(left / 86400000));
  units.Hours.textContent = pad(Math.floor(left / 3600000) % 24);
  units.Minutes.textContent = pad(Math.floor(left / 60000) % 60);
  units.Seconds.textContent = pad(Math.floor(left / 1000) % 60);
};
tick();
setInterval(tick, 1000);
