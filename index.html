const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const imgSrc = (url, width = 720) => {
  if (!url) return "";
  if (!url.includes("cdn.shopify.com")) return url;
  const bare = url.replace(/([?&])width=\d+/, "");
  return bare + (bare.includes("?") ? "&" : "?") + "width=" + width;
};
const attrs = (href) => {
  const safe = esc(href || "#");
  if (!href || href.startsWith("#") || href.startsWith("mailto:")) return `href="${safe}"`;
  return `href="${safe}" target="_blank" rel="noopener"`;
};
const firstOption = (item) => (item.options && item.options[0]) || item;
const media = (item) => item.image
  ? `<div class="media"><img src="${esc(imgSrc(item.image))}" alt="${esc(item.name)}"></div>`
  : `<div class="media" style="color:#5c6578;font-weight:700">Photo pending</div>`;
const priceBlock = (item, tone) => {
  const current = firstOption(item);
  const saveClass = tone === "deal" ? "save save--blue" : item.quiet ? "save save--quiet" : "save";
  const msrp = item.msrp ? `<p class="msrp">MSRP <s>${esc(item.msrp)}</s></p>` : "";
  const save = current.save ? `<p><span class="${saveClass}" data-save-now>${esc(current.save)}</span></p>` : "";
  return `${msrp}<p class="now" data-price-now>${esc(current.price)}</p>${save}<p class="ship">${esc(item.shipping || "")}</p>`;
};
const options = (item) => {
  if (!item.options) return "";
  return `<div class="options" role="group" aria-label="Offer for ${esc(item.name)}">${item.options.map((option, index) =>
    `<button type="button" class="opt${index === 0 ? " is-on" : ""}" aria-pressed="${index === 0}" data-price="${esc(option.price)}" data-save="${esc(option.save)}" data-note="${esc(option.note)}">${esc(option.label)}</button>`
  ).join("")}</div>`;
};
const card = (item, tone) => {
  const current = firstOption(item);
  const tag = tone === "deal" ? "Deal" : tone === "full" ? "Full price" : tone === "best" ? "Best Seller" : "Super Deal";
  const tagClass = tone === "deal" ? "tag--deal" : tone === "full" ? "tag--full" : tone === "best" ? "tag--best" : "tag--super";
  return `<article class="card${item.layout === "lead" ? " card--lead" : ""}">
    ${media(item)}
    <div>
      <span class="tag ${tagClass}">${tag}</span>
      <h3>${esc(item.name)}</h3>

      ${(current.note || item.note) ? `<p class="note" data-note-now>${esc(current.note || item.note)}</p>` : `<p class="note" data-note-now hidden></p>`}
      ${priceBlock(item, tone)}
      <a class="btn btn--navy btn--block" ${attrs(item.href)}>${esc(item.cta || "Shop now")}</a>
    </div>
  </article>`;
};

  cardNode.querySelector("[data-price-now]").textContent = button.dataset.price;
  cardNode.querySelector("[data-save-now]").textContent = button.dataset.save;
  cardNode.querySelector("[data-note-now]").textContent = button.dataset.note;
});

const units = {
  Days: document.querySelector('[data-unit="Days"]'),
  Hours: document.querySelector('[data-unit="Hours"]'),
  Minutes: document.querySelector('[data-unit="Minutes"]'),
  Seconds: document.querySelector('[data-unit="Seconds"]')
};
const pad = (value) => String(value).padStart(2, "0");
const tick = () => {
  const left = endDate.getTime() - Date.now();
  if (left <= 0) {
    units.Days.textContent = "00";
    units.Hours.textContent = "00";
    units.Minutes.textContent = "00";
    units.Seconds.textContent = "00";
    return;
  }
  units.Days.textContent = pad(Math.floor(left / 86400000));
  units.Hours.textContent = pad(Math.floor(left / 3600000) % 24);
  units.Minutes.textContent = pad(Math.floor(left / 60000) % 60);
  units.Seconds.textContent = pad(Math.floor(left / 1000) % 60);
};
tick();
setInterval(tick, 1000);

document.querySelectorAll("[data-carousel]").forEach((carousel) => {
  const slides = [...carousel.querySelectorAll(".carousel__slide")];
  const dots = [...carousel.querySelectorAll(".carousel__dots button")];
  if (slides.length < 2) return;
  let index = 0;
  const show = (next) => {
    index = (next + slides.length) % slides.length;
    slides.forEach((slide, i) => slide.classList.toggle("is-on", i === index));
    dots.forEach((dot, i) => dot.classList.toggle("is-on", i === index));
  };
  carousel.querySelector(".carousel__nav--next").addEventListener("click", () => show(index + 1));
  carousel.querySelector(".carousel__nav--prev").addEventListener("click", () => show(index - 1));
  dots.forEach((dot, dotIndex) => dot.addEventListener("click", () => show(dotIndex)));
});

document.addEventListener("change", (event) => {
  const select = event.target.closest("[data-variant-select]");
  if (!select) return;
  const chosen = select.selectedOptions[0];
  const box = select.closest(".showcase");
  const price = Number(chosen.dataset.price);
  const msrp = Number(chosen.dataset.msrp);
  const save = msrp > price ? msrp - price : 0;
  box.querySelector("[data-price-now]").textContent = usd(price);
  const msrpNode = box.querySelector("[data-msrp-now]");
  msrpNode.hidden = !save;
  msrpNode.querySelector("s").textContent = save ? usd(msrp) : "";
  const saveNode = box.querySelector("[data-save-now]");
  saveNode.hidden = !save;
  saveNode.textContent = save ? "Save " + usd(save) : "";
  const promo = box.querySelector(".affirm-as-low-as");
  if (promo && chosen.dataset.id) promo.setAttribute("data-amount", String(Math.round(price * 100)));
  const cart = box.querySelector("[data-cart]");
  if (cart && chosen.dataset.id) cart.href = "https://www.1laser.com/cart/" + chosen.dataset.id + ":1";
  if (window.affirm && window.affirm.ui && window.affirm.ui.refresh) window.affirm.ui.refresh();
});
